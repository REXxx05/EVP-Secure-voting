# SR-20: Security CI
name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evp_admin
          POSTGRES_PASSWORD: ci-admin-password
          POSTGRES_DB: evp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evp_admin -d evp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Create all isolated test databases and apply migrations
        env:
          PGHOST: localhost
          PGPASSWORD: ci-admin-password
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -U evp_admin -d evp \
            -c "CREATE ROLE evp_app WITH LOGIN PASSWORD 'ci-app-password';"

          for database in evp evp_sr18_compat evp_sr17_test; do
            if [ "$database" != evp ]; then
              createdb -U evp_admin "$database"
            fi
            echo "Setting up $database"
            psql -v ON_ERROR_STOP=1 -U evp_admin -d "$database" -f database/01_schema.sql
            for file in database/0*.sql database/1*.sql; do
              if [ "$file" = database/01_schema.sql ]; then
                continue
              fi
              echo "Applying $file to $database"
              psql -v ON_ERROR_STOP=1 -U evp_admin -d "$database" -f "$file"
            done
            psql -v ON_ERROR_STOP=1 -U evp_admin -d "$database" \
              -v app_user=evp_app -v db_name="$database" \
              -f database/setup/roles.sql
          done
      - name: Write throwaway test configuration
        run: |
          gen() {
            node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
          }
          sign_key() {
            node -e "const c=require('crypto');console.log(Buffer.from(c.generateKeyPairSync('ed25519').privateKey.export({type:'pkcs8',format:'pem'})).toString('base64'))"
          }
          {
            echo "PORT=3000"
            echo "DB_HOST=localhost"
            echo "DB_PORT=5432"
            echo "DB_NAME=evp"
            echo "DB_USER=evp_app"
            echo "DB_PASSWORD=ci-app-password"
            echo "DB_ADMIN_USER=evp_admin"
            echo "DB_ADMIN_PASSWORD=ci-admin-password"
            echo "JWT_SECRET=$(gen)"
            echo "DATA_ENCRYPTION_KEY=$(gen)"
            echo "BALLOT_INTEGRITY_KEY=$(gen)"
            echo "VOTER_LOG_HMAC_KEY=$(gen)"
            echo "RECEIPT_SIGNING_PRIVATE_KEY=$(sign_key)"
            echo "TLS_CERT_PATH=certs/cert.pem"
            echo "TLS_KEY_PATH=certs/key.pem"
          } > .env
      - name: Run standard tests
        working-directory: backend
        env:
          DB_NAME: evp
        run: npm test -- --runInBand --testPathIgnorePatterns='tests/integration/(rbac|signedCandidateActions)\.test\.js'
      - name: Run isolated RBAC compatibility tests
        working-directory: backend
        env:
          DB_NAME: evp_sr18_compat
        run: npm test -- --runInBand --runTestsByPath tests/integration/rbac.test.js
      - name: Run isolated SR-18 signature tests
        working-directory: backend
        env:
          DB_NAME: evp_sr17_test
        run: npm test -- --runInBand --runTestsByPath tests/integration/signedCandidateActions.test.js

  dependency-scan:
    name: Dependency scan (CVSS >= 7.0 fails)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (full tree, including dev dependencies)
        working-directory: backend
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/check-audit.js "$RUNNER_TEMP/audit.json"

  static-analysis:
    name: Static analysis (ESLint security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Lint (any finding fails the build)
        working-directory: backend
        run: npx eslint . --max-warnings 0

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: /language:javascript-typescript

  sbom:
    name: SBOM builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate CycloneDX SBOM from the lockfile
        working-directory: backend
        run: |
          npm sbom --package-lock-only --sbom-format cyclonedx > "$RUNNER_TEMP/sbom.cdx.json"
          node -e "const s=require('$RUNNER_TEMP/sbom.cdx.json');if(s.bomFormat!=='CycloneDX'||!Array.isArray(s.components)||s.components.length===0){console.error('SBOM is empty or invalid');process.exit(1)}console.log('SBOM components:',s.components.length)"
